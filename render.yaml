services:
  - type: web
    name: airflow-fullstack
    runtime: python
    plan: free
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r requirements.txt"
    startCommand: "gunicorn 'app:create_app()'"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: USE_VITE_FRONTEND
        value: "false"
